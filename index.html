<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Make a Bouquet ✿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Nunito:wght@300;400;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css?v=5"/>

<body>

<!-- ══════════════════════════════════════════════
     HIDDEN SVG DEFS — gradients + realistic flower symbols
══════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
<defs>

  <!-- FILTERS -->
  <filter id="f-drop" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2a0810" flood-opacity="0.30"/>
  </filter>
  <filter id="f-drop-sm" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#2a0810" flood-opacity="0.20"/>
  </filter>

  <!-- STEM / LEAF -->
  <linearGradient id="g-stem" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#1e4a14"/>
    <stop offset="40%"  stop-color="#56a038"/>
    <stop offset="100%" stop-color="#183c10"/>
  </linearGradient>
  <linearGradient id="g-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#72c050"/>
    <stop offset="100%" stop-color="#265a1c"/>
  </linearGradient>
  <linearGradient id="g-branch" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#6a3a18"/>
    <stop offset="50%"  stop-color="#9c6030"/>
    <stop offset="100%" stop-color="#5a2a10"/>
  </linearGradient>

  <!-- ══ ROSE ══ radial, light from upper-left -->
  <radialGradient id="g-rose-o" cx="30" cy="22" r="52" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#ffb8cc"/>
    <stop offset="45%"  stop-color="#c42040"/>
    <stop offset="100%" stop-color="#620816"/>
  </radialGradient>
  <radialGradient id="g-rose-m" cx="32" cy="28" r="40" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#ffd4e4"/>
    <stop offset="48%"  stop-color="#d83858"/>
    <stop offset="100%" stop-color="#881428"/>
  </radialGradient>
  <radialGradient id="g-rose-i" cx="35" cy="32" r="26" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#ffe8f2"/>
    <stop offset="52%"  stop-color="#ee7090"/>
    <stop offset="100%" stop-color="#b02848"/>
  </radialGradient>
  <radialGradient id="g-rose-c" cx="38" cy="35" r="16" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#fff5f9"/>
    <stop offset="65%"  stop-color="#ffd0de"/>
    <stop offset="100%" stop-color="#f090a8"/>
  </radialGradient>

  <!-- ══ TULIP ══ -->
  <radialGradient id="g-tulip-b" cx="28" cy="14" r="58" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#ff88a0"/>
    <stop offset="42%"  stop-color="#c81e38"/>
    <stop offset="100%" stop-color="#680612"/>
  </radialGradient>
  <radialGradient id="g-tulip-i" cx="40" cy="20" r="32" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#ffe0e8"/>
    <stop offset="52%"  stop-color="#f06078"/>
    <stop offset="100%" stop-color="#a81c38"/>
  </radialGradient>
  <radialGradient id="g-tulip-s" cx="55" cy="44" r="30" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#500410"/>
    <stop offset="100%" stop-color="#800c20" stop-opacity="0"/>
  </radialGradient>

  <!-- ══ SUNFLOWER ══ -->
  <radialGradient id="g-sun-p" cx="50%" cy="94%" r="92%">
    <stop offset="0%"   stop-color="#fff480"/>
    <stop offset="58%"  stop-color="#f8a600"/>
    <stop offset="100%" stop-color="#b06000"/>
  </radialGradient>
  <radialGradient id="g-sun-c" cx="32" cy="30" r="18" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#7a4818"/>
    <stop offset="52%"  stop-color="#341408"/>
    <stop offset="100%" stop-color="#180804"/>
  </radialGradient>
  <radialGradient id="g-sun-h" cx="32" cy="30" r="10" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="rgba(180,120,60,0.55)"/>
    <stop offset="100%" stop-color="rgba(180,120,60,0)"/>
  </radialGradient>

  <!-- ══ DAISY ══ -->
  <radialGradient id="g-daisy-p" cx="50%" cy="95%" r="90%">
    <stop offset="0%"   stop-color="#fffff8"/>
    <stop offset="38%"  stop-color="#f8f2de"/>
    <stop offset="100%" stop-color="#d0c490"/>
  </radialGradient>
  <radialGradient id="g-daisy-c" cx="34" cy="40" r="13" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#fff076"/>
    <stop offset="55%"  stop-color="#f0b018"/>
    <stop offset="100%" stop-color="#8c5610"/>
  </radialGradient>

  <!-- ══ LILY ══ -->
  <radialGradient id="g-lily-a" cx="50%" cy="94%" r="102%">
    <stop offset="0%"   stop-color="#fff2f4"/>
    <stop offset="35%"  stop-color="#f4a0b8"/>
    <stop offset="100%" stop-color="#c03870"/>
  </radialGradient>
  <radialGradient id="g-lily-b" cx="50%" cy="94%" r="102%">
    <stop offset="0%"   stop-color="#fff0ec"/>
    <stop offset="38%"  stop-color="#f8b09c"/>
    <stop offset="100%" stop-color="#d05038"/>
  </radialGradient>
  <radialGradient id="g-lily-c" cx="40%" cy="38%" r="60%">
    <stop offset="0%"   stop-color="#fffce0"/>
    <stop offset="100%" stop-color="#d4bc50"/>
  </radialGradient>

  <!-- ══ CHERRY BLOSSOM ══ -->
  <radialGradient id="g-cher-p" cx="30" cy="22" r="26" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#fff8fc"/>
    <stop offset="50%"  stop-color="#ffc4d8"/>
    <stop offset="100%" stop-color="#d48ca8"/>
  </radialGradient>
  <radialGradient id="g-cher-c" cx="40%" cy="38%" r="62%">
    <stop offset="0%"   stop-color="#fff8d4"/>
    <stop offset="100%" stop-color="#f0c850"/>
  </radialGradient>

  <!-- ══ LAVENDER ══ -->
  <radialGradient id="g-lav-hi" cx="30%" cy="25%" r="72%">
    <stop offset="0%"   stop-color="#e8c0f8"/>
    <stop offset="55%"  stop-color="#9858c8"/>
    <stop offset="100%" stop-color="#4a1878"/>
  </radialGradient>
  <radialGradient id="g-lav-lo" cx="30%" cy="25%" r="72%">
    <stop offset="0%"   stop-color="#d4a8f0"/>
    <stop offset="55%"  stop-color="#7840b0"/>
    <stop offset="100%" stop-color="#380e60"/>
  </radialGradient>

  <!-- ══ PEONY ══ bezier petals, 4 rings -->
  <radialGradient id="g-peo-o" cx="26" cy="18" r="62" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#ffb8d4"/>
    <stop offset="44%"  stop-color="#e83c8a"/>
    <stop offset="100%" stop-color="#76084c"/>
  </radialGradient>
  <radialGradient id="g-peo-m" cx="28" cy="22" r="48" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#ffd0e8"/>
    <stop offset="50%"  stop-color="#f06498"/>
    <stop offset="100%" stop-color="#9e1858"/>
  </radialGradient>
  <radialGradient id="g-peo-i" cx="33" cy="27" r="34" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#fff0f8"/>
    <stop offset="58%"  stop-color="#f898ba"/>
    <stop offset="100%" stop-color="#c8447c"/>
  </radialGradient>
  <radialGradient id="g-peo-c" cx="38%" cy="34%" r="58%">
    <stop offset="0%"   stop-color="#fff5fa"/>
    <stop offset="100%" stop-color="#f8d0e2"/>
  </radialGradient>


  <!-- ══════════════════════════════════════
       FLOWER SYMBOLS — each 80×100 viewBox
  ══════════════════════════════════════ -->

  <!-- 🌹 ROSE — 5 outer + 5 mid + 5 inner bezier petals + spiral core -->
  <symbol id="svg-rose" viewBox="0 0 80 100" overflow="visible">
    <!-- Stem -->
    <path d="M40 76 C38 88 42 94 40 100" stroke="url(#g-stem)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M40 90 C32 88 22 82 20 74 C26 74 34 80 40 90Z" fill="url(#g-leaf)" opacity="0.9"/>
    <path d="M40 85 C48 82 58 76 58 68 C52 70 44 76 40 85Z" fill="url(#g-leaf)" opacity="0.85"/>
    <!-- Guard petals (outer ring, wide cupped) -->
    <g filter="url(#f-drop)" opacity="0.92">
      <path d="M40 72 C22 66 12 56 14 42 C16 30 28 22 40 22 C52 22 64 30 66 42 C68 56 58 66 40 72Z" fill="url(#g-rose-o)"/>
      <path d="M40 72 C26 62 18 50 24 36 C28 24 40 20 40 20 L40 72Z" fill="url(#g-rose-o)" opacity="0.6"/>
      <path d="M40 72 C54 62 62 50 56 36 C52 24 40 20 40 20 L40 72Z" fill="url(#g-rose-o)" opacity="0.55"/>
    </g>
    <!-- Outer petals (5, cupped up) -->
    <path d="M40 66 C28 60 20 50 22 38 C24 28 32 22 40 22 C48 22 56 28 58 38 C60 50 52 60 40 66Z" fill="url(#g-rose-m)"/>
    <path d="M40 66 C24 58 20 46 26 36 C30 26 40 22 40 22 L40 66Z" fill="url(#g-rose-m)" opacity="0.7"/>
    <path d="M40 66 C56 58 60 46 54 36 C50 26 40 22 40 22 L40 66Z" fill="url(#g-rose-m)" opacity="0.65"/>
    <!-- Mid petals (tighter) -->
    <path d="M40 58 C30 52 24 44 26 34 C28 26 34 22 40 22 C46 22 52 26 54 34 C56 44 50 52 40 58Z" fill="url(#g-rose-i)"/>
    <path d="M40 58 C26 50 24 40 30 32 C34 24 40 22 40 22 L40 58Z" fill="url(#g-rose-i)" opacity="0.65"/>
    <path d="M40 58 C54 50 56 40 50 32 C46 24 40 22 40 22 L40 58Z" fill="url(#g-rose-i)" opacity="0.6"/>
    <!-- Inner petals (tight spiraling) -->
    <path d="M40 50 C33 46 29 40 31 32 C33 26 37 22 40 22 C43 22 47 26 49 32 C51 40 47 46 40 50Z" fill="url(#g-rose-c)"/>
    <path d="M40 50 C32 44 32 36 36 30 C38 26 40 22 40 50Z" fill="url(#g-rose-c)" opacity="0.5"/>
    <path d="M40 50 C48 44 48 36 44 30 C42 26 40 22 40 50Z" fill="url(#g-rose-c)" opacity="0.45"/>
    <!-- Rose center bud -->
    <ellipse cx="40" cy="33" rx="7" ry="8" fill="url(#g-rose-c)"/>
    <ellipse cx="40" cy="31" rx="4.5" ry="5.5" fill="#fff5f9"/>
    <ellipse cx="40" cy="30" rx="2.5" ry="3" fill="#ffeef4"/>
    <!-- Specular -->
    <ellipse cx="36" cy="27" rx="3" ry="2" fill="white" opacity="0.7"/>
    <ellipse cx="37" cy="28" rx="1.5" ry="1" fill="white" opacity="0.85"/>
  </symbol>

  <!-- 🌷 TULIP — 3 outer + 2 inner teardrop bezier petals, opening top -->
  <symbol id="svg-tulip" viewBox="0 0 80 100" overflow="visible">
    <!-- Stem -->
    <path d="M40 72 C39 84 41 92 40 100" stroke="url(#g-stem)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M40 88 C30 82 22 72 24 62 C30 62 38 74 40 88Z" fill="url(#g-leaf)"/>
    <path d="M40 84 C50 78 58 68 56 58 C50 58 42 70 40 84Z" fill="url(#g-leaf)" opacity="0.8"/>
    <!-- Back outer petals (darker) -->
    <g filter="url(#f-drop)" opacity="0.9">
      <path d="M25 52 C18 44 17 30 25 18 C30 12 36 10 40 10 L40 72 C34 70 27 62 25 52Z" fill="url(#g-tulip-b)"/>
      <path d="M55 52 C62 44 63 30 55 18 C50 12 44 10 40 10 L40 72 C46 70 53 62 55 52Z" fill="url(#g-tulip-b)"/>
    </g>
    <!-- Front center petal (lit) -->
    <path d="M40 72 C28 66 24 52 26 36 C28 22 34 12 40 10 C46 12 52 22 54 36 C56 52 52 66 40 72Z" fill="url(#g-tulip-b)"/>
    <!-- Inner light -->
    <path d="M40 70 C32 62 30 50 32 36 C34 24 38 14 40 10 C42 14 46 24 48 36 C50 50 48 62 40 70Z" fill="url(#g-tulip-i)" opacity="0.75"/>
    <!-- Small inner petals at top -->
    <path d="M33 18 C30 12 32 6 37 8 C38 12 37 16 33 18Z" fill="url(#g-tulip-b)"/>
    <path d="M47 18 C50 12 48 6 43 8 C42 12 43 16 47 18Z" fill="url(#g-tulip-b)"/>
    <path d="M40 16 C38 8 42 6 44 8 C43 12 42 16 40 16Z" fill="url(#g-tulip-i)"/>
    <!-- Shadow crease on right -->
    <path d="M40 70 C50 62 54 50 54 36 C54 36 48 38 44 44 C42 50 40 70 40 70Z" fill="url(#g-tulip-s)" opacity="0.5"/>
    <!-- Specular streak on left petal -->
    <path d="M31 40 C30 36 32 30 34 26" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.22" fill="none"/>
  </symbol>

  <!-- 🌻 SUNFLOWER — 16 tapered bezier petals, realistic seed center -->
  <symbol id="svg-sunflower" viewBox="0 0 80 100" overflow="visible">
    <!-- Stem -->
    <path d="M40 74 C39 86 41 93 40 100" stroke="url(#g-stem)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M40 88 C30 84 20 76 20 66 C27 66 36 78 40 88Z" fill="url(#g-leaf)"/>
    <!-- Back petals -->
    <g filter="url(#f-drop)" opacity="0.82">
      <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(11.25  40 52)"/>
      <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(33.75  40 52)"/>
      <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(56.25  40 52)"/>
      <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(78.75  40 52)"/>
      <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(101.25 40 52)"/>
      <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(123.75 40 52)"/>
      <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(146.25 40 52)"/>
      <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(168.75 40 52)"/>
    </g>
    <!-- Front petals -->
    <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(0    40 52)"/>
    <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(22.5  40 52)"/>
    <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(45    40 52)"/>
    <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(67.5  40 52)"/>
    <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(90    40 52)"/>
    <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(112.5 40 52)"/>
    <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(135   40 52)"/>
    <path d="M40 52 C36 44 33 30 40 18 C47 30 44 44 40 52Z" fill="url(#g-sun-p)" transform="rotate(157.5 40 52)"/>
    <!-- Center disk -->
    <circle cx="40" cy="52" r="17" fill="url(#g-sun-c)" filter="url(#f-drop-sm)"/>
    <circle cx="40" cy="52" r="17" fill="url(#g-sun-h)"/>
    <!-- Seed pattern — fibonacci spiral dots -->
    <circle cx="40" cy="47" r="1.6" fill="#5a3010"/>
    <circle cx="37" cy="49" r="1.5" fill="#5a3010"/>
    <circle cx="43" cy="49" r="1.5" fill="#5a3010"/>
    <circle cx="35" cy="52" r="1.5" fill="#5a3010"/>
    <circle cx="40" cy="52" r="1.7" fill="#5a3010"/>
    <circle cx="45" cy="52" r="1.5" fill="#5a3010"/>
    <circle cx="37" cy="55" r="1.5" fill="#5a3010"/>
    <circle cx="43" cy="55" r="1.5" fill="#5a3010"/>
    <circle cx="40" cy="57" r="1.5" fill="#5a3010"/>
    <circle cx="33" cy="49" r="1.3" fill="#5a3010"/>
    <circle cx="47" cy="49" r="1.3" fill="#5a3010"/>
    <circle cx="32" cy="53" r="1.2" fill="#5a3010"/>
    <circle cx="48" cy="53" r="1.2" fill="#5a3010"/>
    <circle cx="34" cy="56" r="1.2" fill="#5a3010"/>
    <circle cx="46" cy="56" r="1.2" fill="#5a3010"/>
    <!-- Center specular -->
    <ellipse cx="35" cy="47" rx="4" ry="3" fill="rgba(180,120,60,0.28)"/>
  </symbol>

  <!-- 🌼 DAISY — 12 narrow bezier petals, golden center -->
  <symbol id="svg-daisy" viewBox="0 0 80 100" overflow="visible">
    <!-- Stem -->
    <path d="M40 73 C39 85 41 92 40 100" stroke="url(#g-stem)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M40 88 C30 84 22 76 22 68 C28 68 38 80 40 88Z" fill="url(#g-leaf)"/>
    <!-- Back petals -->
    <g filter="url(#f-drop)" opacity="0.78">
      <path d="M40 52 C37 44 35 30 40 18 C45 30 43 44 40 52Z" fill="url(#g-daisy-p)" transform="rotate(15   40 52)"/>
      <path d="M40 52 C37 44 35 30 40 18 C45 30 43 44 40 52Z" fill="url(#g-daisy-p)" transform="rotate(45   40 52)"/>
      <path d="M40 52 C37 44 35 30 40 18 C45 30 43 44 40 52Z" fill="url(#g-daisy-p)" transform="rotate(75   40 52)"/>
      <path d="M40 52 C37 44 35 30 40 18 C45 30 43 44 40 52Z" fill="url(#g-daisy-p)" transform="rotate(105  40 52)"/>
      <path d="M40 52 C37 44 35 30 40 18 C45 30 43 44 40 52Z" fill="url(#g-daisy-p)" transform="rotate(135  40 52)"/>
      <path d="M40 52 C37 44 35 30 40 18 C45 30 43 44 40 52Z" fill="url(#g-daisy-p)" transform="rotate(165  40 52)"/>
    </g>
    <!-- Front petals -->
    <path d="M40 52 C37 44 35 30 40 18 C45 30 43 44 40 52Z" fill="url(#g-daisy-p)" transform="rotate(0    40 52)"/>
    <path d="M40 52 C37 44 35 30 40 18 C45 30 43 44 40 52Z" fill="url(#g-daisy-p)" transform="rotate(30   40 52)"/>
    <path d="M40 52 C37 44 35 30 40 18 C45 30 43 44 40 52Z" fill="url(#g-daisy-p)" transform="rotate(60   40 52)"/>
    <path d="M40 52 C37 44 35 30 40 18 C45 30 43 44 40 52Z" fill="url(#g-daisy-p)" transform="rotate(90   40 52)"/>
    <path d="M40 52 C37 44 35 30 40 18 C45 30 43 44 40 52Z" fill="url(#g-daisy-p)" transform="rotate(120  40 52)"/>
    <path d="M40 52 C37 44 35 30 40 18 C45 30 43 44 40 52Z" fill="url(#g-daisy-p)" transform="rotate(150  40 52)"/>
    <!-- Center dome -->
    <circle cx="40" cy="52" r="12" fill="url(#g-daisy-c)" filter="url(#f-drop-sm)"/>
    <circle cx="37" cy="49" r="2"   fill="#d0980c" opacity="0.55"/>
    <circle cx="43" cy="49" r="2"   fill="#d0980c" opacity="0.55"/>
    <circle cx="40" cy="47" r="2"   fill="#d0980c" opacity="0.55"/>
    <circle cx="36" cy="54" r="1.8" fill="#d0980c" opacity="0.5"/>
    <circle cx="44" cy="54" r="1.8" fill="#d0980c" opacity="0.5"/>
    <circle cx="40" cy="57" r="1.8" fill="#d0980c" opacity="0.5"/>

    <ellipse cx="36" cy="48" rx="3" ry="2.2" fill="white" opacity="0.38"/>
  </symbol>

  <!-- 🌸 LILY — 6 reflexed bezier petals with spots -->
  <symbol id="svg-lily" viewBox="0 0 80 100" overflow="visible">
    <!-- Stem -->
    <path d="M40 72 C39 84 41 92 40 100" stroke="url(#g-stem)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Leaf (curving) -->
    <path d="M40 88 C28 82 18 70 20 60 C26 60 38 76 40 88Z" fill="url(#g-leaf)"/>
    <!-- Petal set A (reflexed, pink) -->
    <g filter="url(#f-drop)">
      <path d="M40 54 C26 54 12 46 10 34 C10 22 22 16 32 20 C36 22 38 30 40 54Z" fill="url(#g-lily-a)" transform="rotate(0   40 54)"/>
      <path d="M40 54 C26 54 12 46 10 34 C10 22 22 16 32 20 C36 22 38 30 40 54Z" fill="url(#g-lily-b)" transform="rotate(120 40 54)"/>
      <path d="M40 54 C26 54 12 46 10 34 C10 22 22 16 32 20 C36 22 38 30 40 54Z" fill="url(#g-lily-a)" transform="rotate(240 40 54)"/>
    </g>
    <!-- Petal set B (front-facing, orange-pink) -->
    <path d="M40 54 C26 54 12 46 10 34 C10 22 22 16 32 20 C36 22 38 30 40 54Z" fill="url(#g-lily-b)" transform="rotate(60  40 54)"/>
    <path d="M40 54 C26 54 12 46 10 34 C10 22 22 16 32 20 C36 22 38 30 40 54Z" fill="url(#g-lily-a)" transform="rotate(180 40 54)"/>
    <path d="M40 54 C26 54 12 46 10 34 C10 22 22 16 32 20 C36 22 38 30 40 54Z" fill="url(#g-lily-b)" transform="rotate(300 40 54)"/>
    <!-- Freckle spots on petals -->
    <circle cx="28" cy="36" r="2.4" fill="#b83050" opacity="0.7"/>
    <circle cx="52" cy="36" r="2.4" fill="#b83050" opacity="0.7"/>
    <circle cx="40" cy="28" r="2.2" fill="#b83050" opacity="0.65"/>
    <circle cx="22" cy="44" r="1.8" fill="#b83050" opacity="0.6"/>
    <circle cx="58" cy="44" r="1.8" fill="#b83050" opacity="0.6"/>
    <circle cx="33" cy="31" r="1.6" fill="#b83050" opacity="0.55"/>
    <circle cx="47" cy="31" r="1.6" fill="#b83050" opacity="0.55"/>
    <!-- Center + stamens -->
    <circle cx="40" cy="54" r="5" fill="url(#g-lily-c)"/>
    <!-- Stamens -->
    <g stroke="#6a9010" stroke-width="1.5" stroke-linecap="round" fill="none">

<!-- ══════════════════════════════════════════════
     BUILDER
══════════════════════════════════════════════════ -->
<section id="builder">

  <header class="builder-header">
    <div class="header-eyebrow">✦ handcrafted with love</div>
    <h1>Build a Bouquet</h1>
    <p class="header-sub">Pick your blooms, write a note, share the link — she'll see it bloom.</p>
  </header>

  <div class="builder-layout">

    <!-- Left: Flower palette -->
    <div class="palette-col">
      <div class="col-label">
        <span class="col-label-line"></span>
        <span>Choose your flowers</span>
        <span class="col-label-line"></span>
      </div>
      <div class="flower-grid" id="flowerGrid"></div>
      <p class="count-hint">
        <span class="count-bar-wrap"><span class="count-bar" id="countBar"></span></span>
        <span id="totalCount">0</span> / 15 flowers
      </p>
    </div>

    <!-- Right: Preview + controls -->
    <div class="preview-col">

      <div class="preview-card">
        <div class="col-label small">
          <span class="col-label-line"></span>
          <span>Your bouquet</span>
          <span class="col-label-line"></span>
        </div>
        <div class="mini-stage" id="miniStage">
          <div class="mini-empty" id="miniEmpty">
            <svg width="48" height="60" viewBox="0 0 80 100" overflow="visible"><use href="#svg-rose"/></svg>
            <span>Add flowers to build your bouquet</span>
          </div>
          <div class="mini-bouquet-wrap" id="miniBouquet" style="display:none">
            <div class="mini-3d-container">
              <div class="mini-flowers" id="miniFlowers"></div>
              <div class="mini-wrap">
                <div class="mini-wrap-paper"></div>
                <div class="mini-ribbon"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="message-card">
        <div class="col-label small">
          <span class="col-label-line"></span>
          <span>Add a message <em>(optional)</em></span>
          <span class="col-label-line"></span>
        </div>
        <textarea id="messageInput" maxlength="220" placeholder="Write something sweet…"></textarea>
        <div class="char-count"><span id="charCount">0</span> / 220</div>
      </div>

      <div class="action-row">
        <button class="btn-outline" id="previewBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Preview
        </button>
        <button class="btn-primary" id="generateBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
          Copy Link
        </button>
      </div>

    </div>
  </div>
</section>


<!-- ══════════════════════════════════════════════
     VIEWER
══════════════════════════════════════════════════ -->
<section id="viewer" style="display:none">
  <canvas id="petalCanvas"></canvas>

  <div class="viewer-scene">
    <div class="bouquet-3d-wrapper" id="bouquet3dWrapper">
      <div class="bouquet-perspective">
        <div class="bouquet-tilt" id="bouquetTilt">
          <div class="vflowers" id="vFlowers"></div>
        </div>
      </div>
      <div class="vwrap" id="vWrap">
        <div class="vwrap-paper">
          <div class="vwrap-fold"></div>
          <div class="vwrap-pattern"></div>
        </div>
        <div class="vwrap-ribbon">
        </div>
        <div class="vbow">
          <div class="vbow-loop vbow-loop-l"></div>
          <div class="vbow-loop vbow-loop-r"></div>
          <div class="vbow-knot"></div>
          <div class="vbow-tail vbow-tail-l"></div>
          <div class="vbow-tail vbow-tail-r"></div>
        </div>
      </div>
    </div>

    <div class="viewer-message-wrap" id="viewerMessageWrap">
      <div class="viewer-message" id="viewerMessage"></div>
      <div class="viewer-from">with love ♡</div>
    </div>
  </div>

  <button class="back-btn" id="backBtn">← build your own</button>
</section>

<div class="toast" id="toast"></div>
<script src="script.js?v=5"></script>
</body>
</html>
